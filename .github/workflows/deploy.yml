name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  # Android CI публикует APK релизом в этот репозиторий (тег android-vX.Y.Z) — пересобрать сайт и version.json
  release:
    types: [published, edited, deleted]
  # Веб-версия (PWA) собирается из main Lendel-Group/PWA-Budget: его deploy присылает pwa-updated
  repository_dispatch:
    types: [pwa-updated]
  # «Что нового» веб-версии берётся из CHANGELOG PWA-Budget; заодно подхватывает PWA, если событие не пришло
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # https://lendel.app/mbt/pwa/ — данные PWA (IndexedDB) привязаны к адресу, подкаталог не менять
      - uses: actions/checkout@v4
        with:
          repository: Lendel-Group/PWA-Budget
          ref: main
          path: .pwa
      - run: scripts/build-pwa.sh .pwa
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
